# fly.toml app configuration file generated for patient-fern-1718 on 2026-11-05T21:56:46+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'patient-fern-1718'
primary_region = 'sin'

[env]
  FRONTEND_URL = 'https://expense-tracker-v1-xi.vercel.app'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
